services:
  whatsapp-desk:
    build: .
    container_name: whatsapp-desk
    restart: always
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - TZ=Asia/Karachi
    volumes:
      - ./data:/app/data
      # Optional: a folder on your NAS holding the Excel file (e.g. kept in sync with OneDrive by Synology Cloud Sync).
      # Then paste /sheets/yourfile.xlsx in a company sheet's link box instead of a link.
      - ./sheets:/sheets:ro
